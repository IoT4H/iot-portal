repos:
  - repo: local
    hooks:
      - id: eslint
        name: Run ESLint + Prettier fix in frontend/
        entry: bash -c 'cd frontend && npx eslint --fix $(echo "$@" | tr " " "\n" | grep "^frontend/")'
        language: system
        pass_filenames: true
        files: ^frontend/.*\.(js|ts|jsx|tsx)$

      - id: eslint_backend
        name: Run ESLint + Prettier fix in strapi-backend/
        entry: bash -c 'cd strapi-backend && npx eslint --fix $(echo "$@" | tr " " "\n" | grep "^strapi-backend/")'
        language: system
        pass_filenames: true
        files: ^strapi-backend/(?!database/).*?\.(js|ts)$
